<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 412" width="680" height="412" role="img" aria-labelledby="title desc">
  <title id="title">The statuses of a run</title>
  <desc id="desc">An interaction run's statuses in three groups. Active, where you wait: New, then Running. From Running a run can pause in Waiting, where a person, an approval or child runs must act, and then resume: HumanInteractionRequired, PendingApproval, AwaitingChildren and HumanInteractionComplete. A run ends, from Running or from Waiting, in Final, where you read output or failureDetails: Finished (done), Error (failed or timed out) or Killed (stopped by someone). App, capsule and code pipeline runs have their own statuses in the same groups.</desc>
  <!-- A self-contained dark panel in the Maitento Portal's dark palette (maitento/portal/src/styles/_tokens.scss), so it
       reads the same on the site in either theme and on GitHub. System fonts only: an <img> cannot load web fonts.
       Statuses: maitento/app/Entities/Interactions/InteractionProcessStatus.cs, grouped as ProcessStateMap.cs does. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8193f8"/>
    </marker>
    <marker id="step" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7080"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="411" rx="16" fill="#141416" stroke="#2a2a30"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Active -->
    <rect x="24" y="24" width="220" height="196" rx="12" fill="#1b1b1f" stroke="#2e2e35"/>
    <text x="44" y="56" font-size="18" font-weight="600" fill="#f2f2f4">Active</text>
    <text x="44" y="78" font-size="13" fill="#a6a7b0">wait for it</text>
    <g font-size="13" font-weight="600" text-anchor="middle">
      <rect x="44" y="104" width="58" height="28" rx="14" fill="#232328" stroke="#3a3a42"/>
      <text x="73" y="123" fill="#dcdde3">New</text>
      <path d="M106 118 H126" stroke="#6e7080" stroke-width="1.5" fill="none" marker-end="url(#step)"/>
      <rect x="132" y="104" width="90" height="28" rx="14" fill="rgba(106,168,245,0.14)" stroke="#6aa8f5"/>
      <text x="177" y="123" fill="#93c0f8">Running</text>
    </g>

    <!-- Running -> Final -->
    <path d="M228 118 H408" stroke="#8193f8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="318" y="106" font-size="13" font-weight="600" fill="#a9b6fb" text-anchor="middle">ends</text>

    <!-- Final -->
    <rect x="416" y="24" width="240" height="196" rx="12" fill="#1b1b1f" stroke="#2e2e35"/>
    <text x="436" y="56" font-size="18" font-weight="600" fill="#f2f2f4">Final</text>
    <text x="436" y="78" font-size="13" fill="#a6a7b0">read <tspan font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace" fill="#dcdde3">output</tspan>, or <tspan font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace" fill="#dcdde3">failureDetails</tspan></text>
    <g font-size="13" font-weight="600" text-anchor="middle">
      <rect x="436" y="100" width="80" height="28" rx="14" fill="rgba(60,207,134,0.14)" stroke="#3ccf86"/>
      <text x="476" y="119" fill="#6fe0a7">Finished</text>
      <rect x="436" y="138" width="58" height="28" rx="14" fill="rgba(242,122,118,0.14)" stroke="#f27a76"/>
      <text x="465" y="157" fill="#f59b98">Error</text>
      <rect x="436" y="176" width="62" height="28" rx="14" fill="#232328" stroke="#3a3a42"/>
      <text x="467" y="195" fill="#dcdde3">Killed</text>
    </g>
    <g font-size="12.5" fill="#a6a7b0">
      <text x="526" y="119">done</text>
      <text x="504" y="157">failed or timed out</text>
      <text x="508" y="195">stopped by someone</text>
    </g>

    <!-- Running <-> Waiting, and Waiting -> Final -->
    <path d="M177 138 V254" stroke="#8193f8" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="189" y="245" font-size="13" fill="#a6a7b0">pauses, then resumes</text>
    <path d="M600 256 V226" stroke="#8193f8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="588" y="245" font-size="13" font-weight="600" fill="#a9b6fb" text-anchor="end">ends</text>

    <!-- Waiting -->
    <rect x="24" y="262" width="632" height="104" rx="12" fill="#1b1b1f" stroke="#2e2e35"/>
    <text x="44" y="294" font-size="18" font-weight="600" fill="#f2f2f4">Waiting</text>
    <text x="44" y="316" font-size="13" fill="#a6a7b0">a person, an approval</text>
    <text x="44" y="334" font-size="13" fill="#a6a7b0">or child runs must act</text>
    <g font-size="13" font-weight="600" text-anchor="middle" fill="#f8ca76">
      <rect x="226" y="278" width="202" height="28" rx="14" fill="rgba(245,181,68,0.12)" stroke="#f5b544"/>
      <text x="327" y="297">HumanInteractionRequired</text>
      <rect x="436" y="278" width="136" height="28" rx="14" fill="rgba(245,181,68,0.12)" stroke="#f5b544"/>
      <text x="504" y="297">PendingApproval</text>
      <rect x="226" y="318" width="142" height="28" rx="14" fill="rgba(245,181,68,0.12)" stroke="#f5b544"/>
      <text x="297" y="337">AwaitingChildren</text>
      <rect x="376" y="318" width="210" height="28" rx="14" fill="rgba(245,181,68,0.12)" stroke="#f5b544"/>
      <text x="481" y="337">HumanInteractionComplete</text>
    </g>

    <text x="24" y="394" font-size="12.5" fill="#6e7080">The statuses of an interaction run. App, capsule and code pipeline runs have their own, in the same groups.</text>
  </g>
</svg>
