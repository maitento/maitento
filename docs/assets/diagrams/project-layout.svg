<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" role="img" aria-labelledby="title desc">
  <title id="title">A project's folders</title>
  <desc id="desc">A maitento project folder. The file name is the definition's name: agents/greeter.mtr defines the agent "greeter". Its folders: agents/ holds agents; interactions/ holds interactions, in one-shot/, round-robin/ or managed/; connectors/open-api/ holds the HTTP endpoints your tools call; external-operations/open-api/ holds the tools agents see; apps/ holds one folder per app, with name.mtc and an optional name.mtr; capsules/ holds capsules; looms/ holds memory looms; code-pipelines/ holds one folder per pipeline, with pipeline-definition.json; prompts/ holds long text, read with @prompt("name"); json/ holds JSON Schemas, read with @json("name").</desc>
  <!-- A self-contained dark panel in the Maitento Portal's dark palette (maitento/portal/src/styles/_tokens.scss), so it
       reads the same on the site in either theme and on GitHub. System fonts only: an <img> cannot load web fonts.
       The layout is what `mt deploy` and the SDKs read: maitento/public/sdks/typescript/src/deploy/project.ts. -->
  <rect x="0.5" y="0.5" width="679" height="459" rx="16" fill="#141416" stroke="#2a2a30"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- maitento/ -->
    <path d="M26 30 h11 l4 4 h15 a2 2 0 0 1 2 2 v14 a2 2 0 0 1 -2 2 h-30 a2 2 0 0 1 -2 -2 v-18 a2 2 0 0 1 2 -2 z" fill="rgba(129,147,248,0.18)" stroke="#8193f8" stroke-width="1.5"/>
    <text x="70" y="48" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="600" fill="#f2f2f4">maitento/</text>
    <text x="174" y="48" font-size="14" fill="#a6a7b0">a project: one folder per kind of definition</text>

    <!-- The rule -->
    <rect x="24" y="70" width="632" height="42" rx="10" fill="rgba(129,147,248,0.10)" stroke="rgba(129,147,248,0.45)"/>
    <text x="44" y="96" font-size="14" fill="#dcdde3">The file name is the name:
      <tspan font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace" fill="#c3cbfc">agents/greeter.mtr</tspan>
      <tspan fill="#8193f8">→</tspan> the agent <tspan font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace" fill="#c3cbfc">"greeter"</tspan></text>

    <!-- Folders -->
    <g stroke="#26262c">
      <path d="M24 162 H656"/>
      <path d="M24 192 H656"/>
      <path d="M24 222 H656"/>
      <path d="M24 252 H656"/>
      <path d="M24 282 H656"/>
      <path d="M24 312 H656"/>
      <path d="M24 342 H656"/>
      <path d="M24 372 H656"/>
      <path d="M24 402 H656"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#a9b6fb">
      <text x="44" y="152">agents/</text>
      <text x="44" y="182">interactions/<tspan fill="#6e7080">&lt;kind&gt;/</tspan></text>
      <text x="44" y="212">connectors/open-api/</text>
      <text x="44" y="242">external-operations/open-api/</text>
      <text x="44" y="272">apps/<tspan fill="#6e7080">&lt;name&gt;/</tspan></text>
      <text x="44" y="302">capsules/</text>
      <text x="44" y="332">looms/</text>
      <text x="44" y="362">code-pipelines/<tspan fill="#6e7080">&lt;name&gt;/</tspan></text>
      <text x="44" y="392">prompts/</text>
      <text x="44" y="422">json/</text>
    </g>
    <g font-size="14" fill="#dcdde3">
      <text x="304" y="152">Agents</text>
      <text x="304" y="182">Interactions: one-shot, round-robin or managed</text>
      <text x="304" y="212">The HTTP endpoints your tools call</text>
      <text x="304" y="242">The tools agents see</text>
      <text x="304" y="272">An app: <tspan font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#c3cbfc">&lt;name&gt;.mtc</tspan>, and an optional <tspan font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#c3cbfc">.mtr</tspan></text>
      <text x="304" y="302">Capsules: throwaway Linux machines</text>
      <text x="304" y="332">Memory (looms)</text>
      <text x="304" y="362">A pipeline: <tspan font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#c3cbfc">pipeline-definition.json</tspan></text>
      <text x="304" y="392">Long text, read with <tspan font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#c3cbfc">@prompt("name")</tspan></text>
      <text x="304" y="422">JSON Schemas, read with <tspan font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#c3cbfc">@json("name")</tspan></text>
    </g>
  </g>
</svg>
